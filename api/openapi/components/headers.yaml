AcceptRanges:
  description: Byte ranges are supported by direct responses for this artifact.
  schema:
    type: string
ContentDisposition:
  description: Suggested attachment filename.
  schema:
    type: string
ContentLength:
  description: Response body size in bytes.
  schema:
    type: integer
    format: int64
ContentRange:
  description: Position of the returned part in the artifact, in bytes.
  schema:
    type: string
Location:
  description: Redirect target.
  schema:
    type: string
    format: uri
