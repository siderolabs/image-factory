EmptyResponse:
  description: Successful empty response.
JSONResponse:
  description: JSON response whose detailed schema is owned by the referenced standard.
  content:
    application/json:
      schema: {}
JSONArtifact:
  description: Downloadable JSON artifact.
  headers:
    Content-Disposition:
      $ref: "./headers.yaml#/ContentDisposition"
    Content-Length:
      $ref: "./headers.yaml#/ContentLength"
  content:
    application/json:
      schema: {}
TextResponse:
  description: Plain-text response.
  content:
    text/plain:
      schema:
        type: string
PEMResponse:
  description: PEM-encoded public material.
  content:
    application/x-pem-file:
      schema:
        type: string
SPDXResponse:
  description: Downloadable SPDX 2.3 JSON document.
  headers:
    Content-Disposition:
      $ref: "./headers.yaml#/ContentDisposition"
    Content-Length:
      $ref: "./headers.yaml#/ContentLength"
  content:
    application/spdx+json:
      schema: {}
Artifact:
  description: Downloadable artifact selected by the path suffix.
  headers:
    Content-Disposition:
      $ref: "./headers.yaml#/ContentDisposition"
    Content-Length:
      $ref: "./headers.yaml#/ContentLength"
  content:
    '*/*':
      schema:
        type: string
        format: binary
    application/efi:
      schema:
        type: string
        format: binary
    application/gzip:
      schema:
        type: string
        format: binary
    application/octet-stream:
      schema:
        type: string
        format: binary
    application/x-iso9660-image:
      schema:
        type: string
        format: binary
    application/x-qemu-disk:
      schema:
        type: string
        format: binary
    application/x-xz:
      schema:
        type: string
        format: binary
    text/plain:
      schema:
        type: string
    application/vnd.dev.sigstore.bundle.v0.3+json:
      schema: {}
ArtifactHeaders:
  description: Artifact metadata without a response body.
  headers:
    Content-Disposition:
      $ref: "./headers.yaml#/ContentDisposition"
    Content-Length:
      $ref: "./headers.yaml#/ContentLength"
OCIResponse:
  description: Response forwarded from or generated for an OCI registry.
  content:
    application/octet-stream:
      schema:
        type: string
        format: binary
    application/vnd.oci.image.manifest.v1+json:
      schema: {}
    application/vnd.oci.image.index.v1+json:
      schema: {}
OCIIndexResponse:
  description: OCI image index containing matching referrers.
  headers:
    Content-Length:
      $ref: "./headers.yaml#/ContentLength"
    Docker-Content-Digest:
      schema:
        type: string
    Oci-Filters-Applied:
      schema:
        type: string
  content:
    application/vnd.oci.image.index.v1+json:
      schema: {}
OCIIndexHeaders:
  description: OCI referrer metadata without a response body.
  headers:
    Content-Length:
      $ref: "./headers.yaml#/ContentLength"
    Docker-Content-Digest:
      schema:
        type: string
    Oci-Filters-Applied:
      schema:
        type: string
Found:
  description: Artifact cache redirect.
  headers:
    Location:
      $ref: "./headers.yaml#/Location"
SeeOther:
  description: Browser navigation redirected to Auth0 login when browser login is configured.
  headers:
    Location:
      $ref: "./headers.yaml#/Location"
  content:
    text/html:
      schema:
        type: string
TemporaryRedirect:
  description: External OCI registry redirect.
  headers:
    Location:
      $ref: "./headers.yaml#/Location"
BadRequest:
  description: Invalid input.
  content:
    text/plain:
      schema:
        type: string
Unauthorized:
  description: |
    Authentication is configured and credentials are missing or invalid. API responses advertise
    only Basic authentication even when Bearer credentials are accepted. Browser navigations may
    receive a 303 login redirect instead, and htmx requests receive an `Hx-Redirect` header without
    an authentication challenge.
  headers:
    WWW-Authenticate:
      description: Optional Basic challenge; deliberately never a Bearer challenge.
      schema:
        type: string
        example: 'Basic realm="Image Factory Enterprise", charset="UTF-8"'
    Hx-Redirect:
      description: Optional login URL for an unauthenticated htmx request; mutually exclusive with the Basic challenge.
      schema:
        type: string
        example: /login?return_to=%2F
  content:
    text/plain:
      schema:
        type: string
PaymentRequired:
  description: An Enterprise asset feature is unavailable.
  content:
    text/plain:
      schema:
        type: string
Forbidden:
  description: The authenticated principal fails an ownership, delegation, or cross-subject authorization check.
  content:
    text/plain:
      schema:
        type: string
Conflict:
  description: The request conflicts with a configured limit or the current state of the object.
  content:
    text/plain:
      schema:
        type: string
NotFound:
  description: The route or requested object does not exist.
  content:
    text/plain:
      schema:
        type: string
InternalServerError:
  description: Unexpected server failure.
  content:
    text/plain:
      schema:
        type: string
ServiceUnavailable:
  description: A required service is not ready.
  content:
    text/plain:
      schema:
        type: string
