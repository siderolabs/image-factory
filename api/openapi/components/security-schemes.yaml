basicAuth:
  type: http
  scheme: basic
  description: Htpasswd credentials, or an Auth0 JWT in the Basic password field.
bearerAuth:
  type: http
  scheme: bearer
  bearerFormat: JWT
downloadToken:
  type: apiKey
  in: query
  name: token
