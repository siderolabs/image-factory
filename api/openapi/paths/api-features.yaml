parameters:
- $ref: ../components/parameters.yaml#/TalosVersion
get:
  operationId: getVersionFeatures
  summary: Get the features of a Talos version
  security: []
  responses:
    '200':
      description: Version-dependent features of Talos and of the factory.
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/VersionFeatures"
    '400':
      $ref: "../components/responses.yaml#/BadRequest"
    '500':
      $ref: "../components/responses.yaml#/InternalServerError"
