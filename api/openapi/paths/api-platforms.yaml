parameters:
- $ref: ../components/parameters.yaml#/TalosVersion
get:
  operationId: listPlatforms
  summary: List cloud platforms
  security: []
  responses:
    '200':
      description: Cloud platforms that the Talos version supports.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../components/schemas.yaml#/Platform"
    '400':
      $ref: "../components/responses.yaml#/BadRequest"
    '500':
      $ref: "../components/responses.yaml#/InternalServerError"
