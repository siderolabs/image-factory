parameters:
- $ref: ../components/parameters.yaml#/SchematicID
- $ref: ../components/parameters.yaml#/TalosVersion
get:
  operationId: listSchematicAssets
  security:
  - basicAuth: []
  - bearerAuth: []
  - sessionCookie: []
  summary: List the downloads of a schematic
  description: >-
    Lists the boot assets, their parts, talosctl binaries, installer image and, on Enterprise, the SBOM, VEX
    and vulnerability scan of a schematic, for one Talos version, target and architecture.
  parameters:
  - name: target
    in: query
    required: true
    description: Kind of machine to boot.
    schema:
      type: string
      enum: [metal, cloud, sbc]
  - name: platform
    in: query
    description: Cloud platform, required for the `cloud` target; see `listPlatforms`.
    schema:
      type: string
  - name: board
    in: query
    description: Single-board computer, required for the `sbc` target; see `listBoards`.
    schema:
      type: string
  - name: arch
    in: query
    required: true
    description: Target CPU architecture.
    schema:
      type: string
      enum: [amd64, arm64]
  - name: secureboot
    in: query
    description: Whether to list SecureBoot assets.
    schema:
      type: boolean
      default: false
  responses:
    '200':
      description: Downloads of the schematic.
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/SchematicAssets"
    "303":
      $ref: "../components/responses.yaml#/SeeOther"
    '400':
      $ref: "../components/responses.yaml#/BadRequest"
    '401':
      $ref: "../components/responses.yaml#/Unauthorized"
    '403':
      $ref: "../components/responses.yaml#/Forbidden"
    '404':
      $ref: "../components/responses.yaml#/NotFound"
    '500':
      $ref: "../components/responses.yaml#/InternalServerError"
