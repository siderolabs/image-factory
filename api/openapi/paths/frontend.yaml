healthz:
  get:
    operationId: getHealth
    summary: Check process health
    tags: [Operational]
    security: []
    x-image-factory-internal: true
    responses:
      "200":
        $ref: "../components/responses.yaml#/EmptyResponse"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"
  head:
    operationId: headHealth
    summary: Inspect process health
    tags: [Operational]
    security: []
    x-image-factory-internal: true
    responses:
      "200":
        $ref: "../components/responses.yaml#/EmptyResponse"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"
readyz:
  get:
    operationId: getReadiness
    summary: Check service readiness
    tags: [Operational]
    security: []
    x-image-factory-internal: true
    responses:
      "200":
        $ref: "../components/responses.yaml#/EmptyResponse"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
  head:
    operationId: headReadiness
    summary: Inspect service readiness
    tags: [Operational]
    security: []
    x-image-factory-internal: true
    responses:
      "200":
        $ref: "../components/responses.yaml#/EmptyResponse"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
uiRoot:
  get:
    operationId: getUI
    summary: Open the Image Factory UI
    tags: [UI]
    x-image-factory-internal: true
    responses:
      "200":
        description: Image Factory HTML user interface.
        content:
          text/html:
            schema:
              type: string
      "303":
        $ref: "../components/responses.yaml#/SeeOther"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"
  head:
    operationId: headUI
    summary: Inspect the Image Factory UI
    tags: [UI]
    x-image-factory-internal: true
    responses:
      "200":
        description: Image Factory UI response headers.
      "303":
        $ref: "../components/responses.yaml#/SeeOther"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"
uiTokens:
  get:
    operationId: getUITokens
    summary: Open the API tokens page
    tags: [UI]
    x-image-factory-enterprise: true
    x-image-factory-internal: true
    responses:
      "200":
        description: Image Factory HTML user interface, opened on the API tokens page.
        content:
          text/html:
            schema:
              type: string
      "303":
        $ref: "../components/responses.yaml#/SeeOther"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"
login:
  get:
    operationId: startBrowserLogin
    summary: Start browser authentication
    tags: [Authentication]
    security: []
    x-image-factory-enterprise: true
    x-image-factory-internal: true
    responses:
      "302":
        $ref: "../components/responses.yaml#/Found"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"
logout:
  post:
    operationId: postBrowserLogout
    summary: End a browser session
    tags: [Authentication]
    security: []
    x-image-factory-enterprise: true
    x-image-factory-internal: true
    x-image-factory-handler-validates-body: true
    responses:
      "303":
        description: Browser session ended; continue at the identity provider logout URL.
        headers:
          Location:
            $ref: "../components/headers.yaml#/Location"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"
callback:
  get:
    operationId: completeBrowserLogin
    summary: Complete browser authentication
    tags: [Authentication]
    security: []
    x-image-factory-enterprise: true
    x-image-factory-internal: true
    responses:
      "302":
        $ref: "../components/responses.yaml#/Found"
      "303":
        description: The sign-in failed; continue at /sign-in-error, which explains why.
        headers:
          Location:
            $ref: "../components/headers.yaml#/Location"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"
loginError:
  get:
    operationId: getBrowserLoginError
    summary: Explain a failed browser authentication
    tags: [Authentication]
    security: []
    x-image-factory-enterprise: true
    x-image-factory-internal: true
    parameters:
    - name: reason
      in: query
      # Not an enum: the page explains any other value as an unknown failure, rather than being refused.
      description: Why the sign-in failed, as `cookie`, `rejected` or `account`.
      schema:
        type: string
    responses:
      "200":
        description: Image Factory HTML user interface, which explains why the sign-in failed.
        content:
          text/html:
            schema:
              type: string
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"
staticFavicon:
  parameters:
  - name: filepath+
    in: path
    required: true
    description: Favicon path.
    schema:
      type: string
      minLength: 1
  get:
    operationId: getFaviconAsset
    summary: Download a favicon
    tags: [UI]
    security: []
    x-image-factory-internal: true
    responses:
      "200":
        description: Favicon.
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"
staticFrontendAsset:
  parameters:
  - name: filepath+
    in: path
    required: true
    description: Built frontend asset path.
    schema:
      type: string
      minLength: 1
  get:
    operationId: getFrontendAsset
    summary: Download a built frontend asset
    tags: [UI]
    security: []
    x-image-factory-internal: true
    responses:
      "200":
        description: Built frontend asset; its name carries a content hash.
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"
