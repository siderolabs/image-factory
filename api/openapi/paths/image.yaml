parameters:
- $ref: ../components/parameters.yaml#/SchematicID
- $ref: ../components/parameters.yaml#/TalosVersion
- $ref: ../components/parameters.yaml#/ImageArtifactPath
- $ref: ../components/parameters.yaml#/Filename
get:
  operationId: getImage
  x-image-factory-api-token-scopes: [image:read]
  summary: Download an image artifact
  security:
  - basicAuth: []
  - bearerAuth: []
  - apiTokenQuery: []
  - sessionCookie: []
  responses:
    '200':
      $ref: "../components/responses.yaml#/Artifact"
    '302':
      $ref: "../components/responses.yaml#/Found"
    "303":
      $ref: "../components/responses.yaml#/SeeOther"
    '400':
      $ref: "../components/responses.yaml#/BadRequest"
    '401':
      $ref: "../components/responses.yaml#/Unauthorized"
    '402':
      $ref: "../components/responses.yaml#/PaymentRequired"
    '403':
      $ref: "../components/responses.yaml#/Forbidden"
    '404':
      $ref: "../components/responses.yaml#/NotFound"
    '500':
      $ref: "../components/responses.yaml#/InternalServerError"
head:
  operationId: headImage
  x-image-factory-api-token-scopes: [image:read]
  summary: Inspect an image artifact
  security:
  - basicAuth: []
  - bearerAuth: []
  - apiTokenQuery: []
  - sessionCookie: []
  responses:
    '200':
      $ref: "../components/responses.yaml#/ArtifactHeaders"
    "303":
      $ref: "../components/responses.yaml#/SeeOther"
    '400':
      $ref: "../components/responses.yaml#/BadRequest"
    '401':
      $ref: "../components/responses.yaml#/Unauthorized"
    '402':
      $ref: "../components/responses.yaml#/PaymentRequired"
    '403':
      $ref: "../components/responses.yaml#/Forbidden"
    '404':
      $ref: "../components/responses.yaml#/NotFound"
    '500':
      $ref: "../components/responses.yaml#/InternalServerError"
