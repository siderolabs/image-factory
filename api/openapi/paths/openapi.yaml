get:
  operationId: getOpenAPI
  summary: Get the canonical OpenAPI 3.1 document
  security: []
  responses:
    '200':
      description: OpenAPI 3.1 YAML document.
      content:
        application/yaml:
          schema:
            type: string
    '500':
      $ref: "../components/responses.yaml#/InternalServerError"
