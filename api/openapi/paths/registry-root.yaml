get:
  operationId: checkRegistry
  summary: Check OCI registry availability
  responses:
    '200':
      $ref: "../components/responses.yaml#/EmptyResponse"
    '401':
      $ref: "../components/responses.yaml#/Unauthorized"
    '500':
      $ref: "../components/responses.yaml#/InternalServerError"
head:
  operationId: headRegistry
  summary: Check OCI registry availability without a body
  responses:
    '200':
      $ref: "../components/responses.yaml#/EmptyResponse"
    '401':
      $ref: "../components/responses.yaml#/Unauthorized"
    '500':
      $ref: "../components/responses.yaml#/InternalServerError"
