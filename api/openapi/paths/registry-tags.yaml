parameters:
- $ref: ../components/parameters.yaml#/RegistryNameTail
get:
  operationId: listRegistryTags
  x-image-factory-api-token-scopes: [image:read, source:pull]
  security:
  - basicAuth: []
  - bearerAuth: []
  - sessionCookie: []
  - apiTokenQuery: []
  summary: List or proxy OCI repository tags
  responses:
    "303":
      $ref: "../components/responses.yaml#/SeeOther"
    "401":
      $ref: "../components/responses.yaml#/Unauthorized"
    default:
      $ref: "../components/responses.yaml#/OCIResponse"
    '500':
      $ref: "../components/responses.yaml#/InternalServerError"
head:
  operationId: headRegistryTags
  x-image-factory-api-token-scopes: [image:read, source:pull]
  security:
  - basicAuth: []
  - bearerAuth: []
  - sessionCookie: []
  - apiTokenQuery: []
  summary: Inspect an OCI repository tag listing
  responses:
    "303":
      $ref: "../components/responses.yaml#/SeeOther"
    "401":
      $ref: "../components/responses.yaml#/Unauthorized"
    default:
      $ref: "../components/responses.yaml#/OCIResponse"
    '500':
      $ref: "../components/responses.yaml#/InternalServerError"
