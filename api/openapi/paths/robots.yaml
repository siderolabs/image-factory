get:
  operationId: getRobotsText
  summary: Get crawler directives
  description: |
    Registered only when authentication is enabled. With browser login, crawlers may index the
    sign-in landing page at `/` and its assets; otherwise every path is disallowed.
  tags: [UI]
  security: []
  x-image-factory-enterprise: true
  x-image-factory-internal: true
  responses:
    '200':
      $ref: "../components/responses.yaml#/TextResponse"
    '500':
      $ref: "../components/responses.yaml#/InternalServerError"
