parameters:
- $ref: ../components/parameters.yaml#/SchematicID
- $ref: ../components/parameters.yaml#/TalosVersion
- $ref: ../components/parameters.yaml#/Architecture
get:
  operationId: getSPDX
  x-image-factory-api-token-scopes: [report:read]
  security:
  - basicAuth: []
  - bearerAuth: []
  - sessionCookie: []
  - apiTokenQuery: []
  summary: Get a merged SPDX document
  x-image-factory-enterprise: true
  responses:
    '200':
      $ref: "../components/responses.yaml#/SPDXResponse"
    "303":
      $ref: "../components/responses.yaml#/SeeOther"
    '400':
      $ref: "../components/responses.yaml#/BadRequest"
    '401':
      $ref: "../components/responses.yaml#/Unauthorized"
    '403':
      $ref: "../components/responses.yaml#/Forbidden"
    '404':
      $ref: "../components/responses.yaml#/NotFound"
    '500':
      $ref: "../components/responses.yaml#/InternalServerError"
head:
  operationId: headSPDX
  x-image-factory-api-token-scopes: [report:read]
  security:
  - basicAuth: []
  - bearerAuth: []
  - sessionCookie: []
  - apiTokenQuery: []
  summary: Inspect a merged SPDX document
  x-image-factory-enterprise: true
  responses:
    '200':
      $ref: "../components/responses.yaml#/ArtifactHeaders"
    "303":
      $ref: "../components/responses.yaml#/SeeOther"
    '400':
      $ref: "../components/responses.yaml#/BadRequest"
    '401':
      $ref: "../components/responses.yaml#/Unauthorized"
    '403':
      $ref: "../components/responses.yaml#/Forbidden"
    '404':
      $ref: "../components/responses.yaml#/NotFound"
    '500':
      $ref: "../components/responses.yaml#/InternalServerError"
