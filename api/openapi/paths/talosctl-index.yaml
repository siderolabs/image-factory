parameters:
- $ref: ../components/parameters.yaml#/TalosVersion
get:
  operationId: listTalosctlDownloads
  summary: List talosctl download URLs
  security: []
  responses:
    '200':
      description: Absolute download URLs.
      content:
        application/json:
          schema:
            type: array
            items:
              type: string
              format: uri
    '404':
      $ref: "../components/responses.yaml#/NotFound"
    '500':
      $ref: "../components/responses.yaml#/InternalServerError"
