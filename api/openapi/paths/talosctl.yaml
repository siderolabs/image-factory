parameters:
- $ref: ../components/parameters.yaml#/TalosVersion
- $ref: ../components/parameters.yaml#/ArtifactPath
get:
  operationId: getTalosctl
  summary: Download a talosctl binary
  security: []
  responses:
    '200':
      $ref: "../components/responses.yaml#/Artifact"
    '404':
      $ref: "../components/responses.yaml#/NotFound"
    '500':
      $ref: "../components/responses.yaml#/InternalServerError"
head:
  operationId: headTalosctl
  summary: Inspect a talosctl binary
  security: []
  responses:
    '200':
      $ref: "../components/responses.yaml#/ArtifactHeaders"
    '404':
      $ref: "../components/responses.yaml#/NotFound"
    '500':
      $ref: "../components/responses.yaml#/InternalServerError"
