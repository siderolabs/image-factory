parameters:
- $ref: ../components/parameters.yaml#/TalosVersion
get:
  operationId: getVEX
  x-image-factory-api-token-scopes: [report:read]
  security:
  - basicAuth: []
  - bearerAuth: []
  - sessionCookie: []
  - apiTokenQuery: []
  summary: Get the Talos VEX document
  x-image-factory-enterprise: true
  responses:
    '200':
      $ref: "../components/responses.yaml#/JSONArtifact"
    "303":
      $ref: "../components/responses.yaml#/SeeOther"
    '400':
      $ref: "../components/responses.yaml#/BadRequest"
    '401':
      $ref: "../components/responses.yaml#/Unauthorized"
    '404':
      $ref: "../components/responses.yaml#/NotFound"
    '500':
      $ref: "../components/responses.yaml#/InternalServerError"
head:
  operationId: headVEX
  x-image-factory-api-token-scopes: [report:read]
  security:
  - basicAuth: []
  - bearerAuth: []
  - sessionCookie: []
  - apiTokenQuery: []
  summary: Inspect the Talos VEX document
  x-image-factory-enterprise: true
  responses:
    '200':
      $ref: "../components/responses.yaml#/ArtifactHeaders"
    "303":
      $ref: "../components/responses.yaml#/SeeOther"
    '400':
      $ref: "../components/responses.yaml#/BadRequest"
    '401':
      $ref: "../components/responses.yaml#/Unauthorized"
    '404':
      $ref: "../components/responses.yaml#/NotFound"
    '500':
      $ref: "../components/responses.yaml#/InternalServerError"
