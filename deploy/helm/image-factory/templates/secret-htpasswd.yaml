{{- if and .Values.config.authentication.enabled (eq (default "htpasswd" .Values.config.authentication.provider) "htpasswd") (not .Values.auth.existingSecret) }}
{{- $htpasswd := .Values.auth.htpasswd | required ".Values.auth.htpasswd is required when the htpasswd authentication provider is enabled and auth.existingSecret is empty." -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "image-factory.fullname" . }}-htpasswd
  namespace: {{ include "image-factory.namespace" . }}
  labels:
    {{- include "image-factory.labels" . | nindent 4 }}
type: Opaque
stringData:
  htpasswd: |
    {{- $htpasswd | nindent 4 }}
{{- end }}
