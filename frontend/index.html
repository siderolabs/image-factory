<!doctype html>
<!--
  This file is a Go html/template, executed by internal/frontend/http/spa on every request.
  The template actions are filled in by the backend, so open the UI through image-factory
  rather than the Vite dev server directly.
-->
<html lang="{{ .Lang }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>{{ .Title }}</title>
    <meta name="description" content="{{ .Description }}" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{ .Title }}" />
    <meta property="og:description" content="{{ .Description }}" />
    <link rel="shortcut icon" href="/favicons/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicons/apple-touch-icon-180x180.png" sizes="180x180" />
    <link rel="icon" type="image/png" href="/favicons/favicon-16x16.png" sizes="16x16" />
    <link rel="icon" type="image/png" href="/favicons/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicons/android-chrome-192x192.png" sizes="192x192" />
    <!-- Applies the stored theme before first paint; shared with the server-rendered pages. -->
    <script src="/js/theme.js"></script>
    <!-- Server configuration, read by src/config.ts. -->
    <script id="app-config" type="application/json">
      {{ .Config }}
    </script>
  </head>
  <body>
    <noscript>
      <strong>Image Factory requires JavaScript to be enabled.</strong>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
