configs:
  if_config:
    file: config.yaml
  if_signing_key:
    file: ../../_out/cache-signing-key.key
  if_htpasswd:
    file: htpasswd
volumes:
  if-registry-ghcr-io-data:
  if-registry-local-data:
  if-grype-db:
  if-audit-log:
  if-frontend-node-modules:
services:
  registry.local:
    image: ghcr.io/distribution/distribution:edge
    volumes:
      - if-registry-local-data:/var/lib/registry
    environment:
      - OTEL_TRACES_EXPORTER=none
      - REGISTRY_LOG_LEVEL=info
      - REGISTRY_STORAGE_DELETE_ENABLED=true
    ports:
      - "5100:5000"
    restart: unless-stopped
  registry.ghcr.io:
    image: ghcr.io/distribution/distribution:edge
    volumes:
      - if-registry-ghcr-io-data:/var/lib/registry
    environment:
      - REGISTRY_PROXY_REMOTEURL=https://ghcr.io
      - OTEL_TRACES_EXPORTER=none
      - REGISTRY_LOG_LEVEL=info
      - REGISTRY_STORAGE_DELETE_ENABLED=true
    restart: unless-stopped
  extra-extensions:
    image: gcr.io/go-containerregistry/crane/debug:v0.22.1
    depends_on:
      - registry.local
    volumes:
      - ../push-extra-extensions.sh:/src/hack/push-extra-extensions.sh:ro
      - ../../internal/integration/testdata/extra-extensions:/src/internal/integration/testdata/extra-extensions:ro
    entrypoint: ["/busybox/sh", "/src/hack/push-extra-extensions.sh"]
    command: ["registry.local:5000"]
  node-dev:
    container_name: local-node
    image: ${JS_TOOLCHAIN:?error}
    volumes:
      - ../../frontend:/app
      - if-frontend-node-modules:/app/node_modules
    environment:
      - HOST=0.0.0.0
    ports:
      - "8121:8121"
    working_dir: /app
    command: sh -c 'npm i && npm run serve'
    stop_signal: SIGKILL
  image-factory:
    build:
      context: ../../
      dockerfile: Dockerfile
      target: image-image-factory
      args:
        - TOOLCHAIN=${TOOLCHAIN:?error}
        - PKGS_PREFIX=${PKGS_PREFIX:?error}
        - PKGS=${PKGS:?error}
        - SHA=${SHA:?error}
        - TAG=${TAG:?error}
        - ABBREV_TAG=${ABBREV_TAG:?error}
        - CGO_ENABLED=${CGO_ENABLED:?error}
        - GO_BUILDFLAGS=${GO_BUILDFLAGS}
        - GO_GCFLAGS=${GO_GCFLAGS}
        - GO_LDFLAGS=${GO_LDFLAGS}
        - GOTOOLCHAIN=${GOTOOLCHAIN}
        - GOEXPERIMENT=${GOEXPERIMENT}
        - TESTPKGS=${TESTPKGS:?error}
        - GOIMPORTS_VERSION=${GOIMPORTS_VERSION:?error}
        - GOMOCK_VERSION=${GOMOCK_VERSION:?error}
        - DEEPCOPY_VERSION=${DEEPCOPY_VERSION:?error}
        - GOLANGCILINT_VERSION=${GOLANGCILINT_VERSION:?error}
        - GOFUMPT_VERSION=${GOFUMPT_VERSION:?error}
        - DIS_VULNCHECK_VERSION=${DIS_VULNCHECK_VERSION:?error}
        - HELMDOCS_VERSION=${HELMDOCS_VERSION:?error}
        - JS_TOOLCHAIN=${JS_TOOLCHAIN:?error}
    command:
      - --log-level=debug
      - --config=/etc/image-factory/config.yaml
    depends_on:
      registry.local:
        condition: service_started
      registry.ghcr.io:
        condition: service_started
      extra-extensions:
        condition: service_completed_successfully
    userns_mode: "host"
    # Already resolvable on Docker Desktop and OrbStack; needed on Linux.
    extra_hosts:
      - host.docker.internal:host-gateway
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    # Only used when config.yaml selects the auth0 authentication provider;
    # unset by default so the htpasswd dev setup needs no environment.
    environment:
      - IF_AUTHENTICATION_AUTH0_CLIENTSECRET=${IF_AUTHENTICATION_AUTH0_CLIENTSECRET:-}
      - IF_AUTHENTICATION_AUTH0_SESSIONKEY=${IF_AUTHENTICATION_AUTH0_SESSIONKEY:-}
    ports:
      - "8080:8080"
    volumes:
      - if-grype-db:/var/lib/grype
      - if-audit-log:/var/log/image-factory/audit
    configs:
      - source: if_config
        target: /etc/image-factory/config.yaml
      - source: if_signing_key
        target: /etc/image-factory/cache-signing-key.key
      - source: if_htpasswd
        target: /etc/image-factory/htpasswd
