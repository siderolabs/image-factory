# commit to be tagged for the new release
commit = "HEAD"

project_name = "image-factory"
github_repo = "siderolabs/image-factory"
match_deps = "^github.com/(siderolabs/[a-zA-Z0-9-]+)$"

previous = "v1.6.0"
pre_release = false

[notes]
    [notes.api_tokens]
        title = "API Tokens"
        description = """\
Download tokens and node tokens are now one credential, an API token, and its scopes decide what it may reach.
There are four. `download` authenticates image downloads and PXE scripts, `pull` authenticates the OCI registry a Talos node fetches installers from, `schematic` creates and reads schematics, and `token` mints and revokes tokens.
One key signs all four.

`token` is the only scope that hands out authority, so it is limited in two ways.
A token may not grant a scope it does not hold, and may not grant `token` at all.
A stolen minting credential can spend its own lifetime, but it cannot mint a replacement that outlives revoking it.

The Auth0 machine scope now reads the same route table as `pull`, so widening one widens the other.

Each token also carries a `stored` claim saying whether the factory keeps a record of it, decided once when it is minted rather than inferred from its scopes on every request.
A stored token is in the per-org index, which is what lists it, what keeps it valid and what a revoke removes. An unstored one is a signed string and nothing else. It needs no name, costs no registry write, and is the only kind accepted from a `?token=` query parameter, on any scope.

Lifetime and storage are tied together, so neither kind can be misused. Below `authentication.tokens.ttl.storedMin` (`1h`) a token can only be unstored, since recording something that expires in minutes buys nothing. Above `authentication.tokens.ttl.unstoredMax` (`8h`) it can only be stored, so a long-lived credential can always be withdrawn. In between, the caller picks.

`POST /tokens`, `GET /tokens` and `POST /tokens/:id/revoke` are the only token endpoints.
The `/node-tokens` and `/download-token` routes are gone. A node token is now `{"scopes":["pull"]}` and a download link `{"scopes":["download"],"stored":false}`.
Only the factory's own UI and Go client used them, and this release rejects the tokens they issued anyway.

Breaking changes:

* Node tokens issued by v1.6.0 are rejected. Re-issue them.
* `POST /download-token` is gone. Use `POST /tokens` with `{"scopes":["download"],"stored":false}`.
* `POST /tokens` takes a `stored` field, defaulting to `true`, and its response reports `stored` where it reported `revocable`. `authentication.tokens.ttl.storedMin` and `.unstoredMax` are new.
* `pkg/client`'s `TokenCreate` takes a `stored` argument; `DownloadToken` passes `false` and is otherwise unchanged.
* `authentication.downloadTokenKeyPath`, `authentication.downloadTokenTTL` and `enterprise.nodeTokens` move to `authentication.tokens`. The factory rejects the old keys at startup instead of ignoring them, so a stale config fails loudly.
* One key now signs every scope. A deployment that pointed the download and node tokens at separate key files has to pick one for `authentication.tokens.keyPath`.

See the [authentication docs](https://github.com/siderolabs/image-factory/blob/main/docs/authentication.md#api-tokens) for the upgrade steps.
"""

    [notes.admin_tokens]
        title = "Admin Tokens"
        description = """\
A new `admin` scope is the bootstrap credential for API token management. It reaches the same routes as `token` and differs in one way: it may hand out `token`, which no other scope can.

It cannot be minted over HTTP. `POST /tokens` rejects the scope for every caller, an htpasswd user or Auth0 client included, so no request can produce the credential that hands out minting authority. A new subcommand issues it instead:

```
image-factory admin-token --config /etc/image-factory/config.yaml --subject org_abc123
```

The command is Enterprise-only, and `image-factory --help` lists the commands a build has. The token goes to stdout and the notice about it to stderr, so redirecting stdout gives a usable file. `--ttl` requests a lifetime within `authentication.tokens.ttl.admin`, which defaults to 90 days and allows up to 10 years. `authentication.tokens.keyPath` has to be set, otherwise the token would be signed with a key no replica holds.

An admin token is never recorded, so nothing can revoke it. Rotating `authentication.tokens.keyPath` is what retires one early, and that invalidates every other self-issued token as well. Keep it offline and give it the shortest lifetime the deployment can live with.

An admin token is also the only credential that may mint for another identity. `POST /tokens` takes a `subject` field, and the minted token belongs to that identity in every sense: it authenticates as it, its record lands in that organization's index, and it counts against that organization's cap. Anything else sending `subject` is refused with `403`, a full htpasswd or Auth0 credential included, since naming another identity reaches across tenants rather than within one. Listing and revocation stay per-identity, so a token minted into another organization is revoked with a credential belonging to it.

Two limits bound it. It may not mint another `admin` token, not even from an admin token, so a leaked one cannot mint a successor that outlives it. And it is refused in a `?token=` query parameter, as is any `token`-scoped credential, because query strings are copied into proxy and CDN access logs.
"""

[make_deps]

    [make_deps.pkgs]
        variable = "PKGS"
        repository = "github.com/siderolabs/pkgs"
