<!DOCTYPE html>
<html lang="{{ lang .Localizer "auth.landing.title" }}">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<title>{{ t .Localizer "auth.landing.title" }}</title>
<meta name="description" content="{{ t .Localizer "auth.landing.description" }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ t .Localizer "auth.landing.title" }}">
<meta property="og:description" content="{{ t .Localizer "auth.landing.description" }}">
<link rel="shortcut icon" href=/favicons/favicon.ico>
<link rel=icon type=image/png href=/favicons/favicon-32x32.png sizes=32x32>
<script src="/js/theme.js"></script>
<link href="/css/output.css" rel="stylesheet">
</head>
<body class="antialiased">
<header class="sticky top-0 z-10 bg-surface-chrome border-b border-border-default">
<div class="container mx-auto max-w-3xl flex items-center justify-between gap-compact px-base py-snug">
<h1 class="type-page-title text-content-emphasis">{{ t .Localizer "auth.landing.title" }}</h1>
</div>
</header>
<main class="container mx-auto max-w-3xl px-base">
<div class="prose prose-sm mt-compact">
<p>{{ t .Localizer "auth.landing.description" }}</p>
</div>
<div class="mt-base">
<a href="{{ .SignInURL }}" class="type-control bg-accent-fill text-content-on-accent hover:bg-accent-fill-hover active:bg-accent-fill-active rounded-lg px-compact py-tight text-center inline-flex items-center transition-colors">{{ t .Localizer "auth.landing.sign_in" }}</a>
</div>
</main>
</body>
</html>
