<!DOCTYPE html>
<html lang="{{ lang .Localizer "auth.login_error.title" }}">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<title>{{ t .Localizer "auth.login_error.title" }}</title>
<script src="/js/theme.js"></script>
<link href="/css/output.css" rel="stylesheet">
</head>
<body class="antialiased">
<main class="md:container md:mx-auto prose mt-compact">
<h1>{{ t .Localizer "auth.login_error.title" }}</h1>
<p>{{ .Reason }}</p>
<p><a class="text-accent-text underline" href="/logout">{{ t .Localizer "auth.login_error.signout" }}</a>{{ t .Localizer "auth.login_error.try_again" }}</p>
</main>
</body>
</html>
