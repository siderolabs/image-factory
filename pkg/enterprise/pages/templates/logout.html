<!DOCTYPE html>
<html lang="{{ lang .Localizer "auth.logout.title" }}">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<title>{{ t .Localizer "auth.logout.title" }}</title>
<script src="/js/theme.js"></script>
<link href="/css/output.css" rel="stylesheet">
</head>
<body class="antialiased">
<main class="md:container md:mx-auto prose mt-compact">
<h1>{{ t .Localizer "auth.logout.title" }}</h1>
<form method="POST" action="/logout">
<button type="submit" class="type-control bg-accent-fill text-content-on-accent hover:bg-accent-fill-hover active:bg-accent-fill-active rounded-lg px-base py-snug text-center inline-flex items-center">{{ t .Localizer "auth.logout.button" }}</button>
</form>
</main>
</body>
</html>
